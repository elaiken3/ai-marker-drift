# Markers to track. Each entry is matched case-insensitively.
# "punct" markers are counted as raw character/token occurrences.
# "phrases" (and "controls") are matched with word-boundary regex on
#   lowercased text (see extract_features.compile_phrase_patterns), so "boast"
#   won't match inside "boastful" -- add both stems explicitly if you want them
#   (e.g. "nuanced" is listed separately from a bare "nuance").

punct:
  - em_dash        # — (U+2014)
  - semicolon      # ;

phrases:
  - delve
  - delves
  - underscore
  - underscores
  - boast
  - boasts
  - meticulous
  - meticulously
  - tapestry
  - navigate the landscape
  - it is important to note
  - it's important to note
  - in conclusion
  - moreover
  - furthermore
  - crucial
  - realm
  - multifaceted
  - nuanced

# Negative controls: words with no AI association. If these show a "break"
# at Nov 2022 too, the signal is corpus drift, not AI. A clean result means
# markers break and controls don't.
controls:
  - however
  - although
  - results
  - during
  - between
